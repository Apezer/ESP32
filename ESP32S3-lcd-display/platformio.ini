; PlatformIO Project Configuration File
; ESP32-S3 + 1.44" ST7735S TFT LCD 测试工程
;
; 接线:
;   SCL/CLK -> GPIO9
;   SDA/MOSI -> GPIO10
;   RES/RST -> GPIO11
;   DC/A0 -> GPIO12
;   CS -> GPIO13
;   BL/LED -> 3.3V (常亮)

[env:dfrobot_firebeetle2_esp32s3]
platform = espressif32@6.5.0
board = dfrobot_firebeetle2_esp32s3
framework = arduino
monitor_speed = 115200

; TFT_eSPI 库依赖
lib_deps =
    bodmer/TFT_eSPI@^2.5.43

; TFT_eSPI 驱动配置 (通过 build flags 设置，无需修改库文件)
build_flags =
    -D USER_SETUP_LOADED
    -D ST7735_DRIVER
    -D TFT_WIDTH=128
    -D TFT_HEIGHT=128
    -D ST7735_GREENTAB3
    -D TFT_RGB_ORDER=TFT_BGR
    -D TFT_MOSI=10
    -D TFT_SCLK=9
    -D TFT_CS=13
    -D TFT_DC=12
    -D TFT_RST=11
    -D SPI_FREQUENCY=27000000
    -D SPI_READ_FREQUENCY=20000000
    -D TOUCH_CS=-1
    -D LOAD_GLCD
    -D LOAD_FONT2
    -D LOAD_FONT4
    -D SMOOTH_FONT
